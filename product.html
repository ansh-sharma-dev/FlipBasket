<!DOCTYPE html>
<html lang="en">
   <head>
       <meta charset="UTF-8">
       <meta name="viewport"contect="width=device-width,initial-scale=1.0">
       <title>Product Details</title>
       <link rel="stylesheet" href="product.css">
   </head> 
   <body>
         <div class="product-container">

            <div class="product-image">
                <img id="productimg" src="" alt="">
            </div>

            <div class="product-info">

                <h1 id="productName">Shoes</h1>
            
                <p>⭐⭐⭐⭐⭐ (4.8)</p>
            
                <div class="price-box">
                    <span class="new-price" id="productPrice">₹999</span>
                    <span class="old-price">₹1499</span>
                    <span class="discount">25% OFF</span>
                </div>
            
                <p>Premium quality product with fast delivery and easy returns.</p>
            
                <div class="features">
                    <p>🚚 Free Delivery</p>
                    <p>🔄 7 Days Return</p>
                    <p>💳 Secure Payment</p>
                    <p>⭐ Premium Quality</p>
                </div>
            
                <div class="quantity">
                    <button class="qty-btn" id="minusBtn">-</button>
                    <span id="qty">1</span>
                    <button class="qty-btn" id="plusBtn">+</button>
                </div>
            
                <div class="btns">
                    <button id="buyBtn" class="buy-btn">Buy Now</button>
                
                    <button id="cartBtn" class="add-btn">Add To Cart</button>
                </div>
            
            </div>
     </div>
   </body>
   <script src="product.js"></script>
</html>
